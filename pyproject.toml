[project]
name = "awv-cycling-clustering"
version = "0.1.0"
description = "Temporal clustering of AWV bicycle count location groups in Flanders."
requires-python = ">=3.11"
dependencies = [
  "branca",
  "folium",
  "joblib",
  "matplotlib",
  "numpy",
  "pandas",
  "pillow",
  "plotly",
  "pyarrow",
  "scikit-learn",
  "shiny",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
