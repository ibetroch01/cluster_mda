[project]
name = "awv-cycling-clustering"
version = "0.1.0"
description = "Temporal clustering of AWV bicycle count location groups in Flanders."
requires-python = ">=3.11"
dependencies = [
  "joblib>=1.5",
  "matplotlib>=3.10",
  "numpy>=2.4",
  "pandas>=3.0",
  "pillow>=12.0",
  "plotly>=6.7",
  "pyarrow>=24.0",
  "pyproj>=3.7",
  "scikit-learn>=1.8",
  "scipy>=1.17",
  "shiny>=1.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
